<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#050e1a;--blue:#0085CA;--blue-h:#0096d6;--blue-lt:#3db8f5;
  --white:#fff;--t1:rgba(255,255,255,0.95);--t2:rgba(200,218,235,0.85);
  --t3:rgba(160,190,215,0.60);--border:rgba(255,255,255,0.08);
  --font:"DM Sans",sans-serif;--red:#f87171;
}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font);background:var(--navy);min-height:100vh;
  color:var(--white);display:flex;align-items:flex-start;
  justify-content:center;padding:0 0 80px;overflow-x:hidden;
}
#app{width:100%;max-width:680px;padding:0 20px;}

/* Background */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 55% 45% at 78% 25%, rgba(0,133,202,0.22) 0%, transparent 55%),
    radial-gradient(ellipse 40% 60% at 85% 70%, rgba(0,80,160,0.18) 0%, transparent 50%),
    radial-gradient(ellipse 30% 40% at 15% 30%, rgba(0,60,120,0.14) 0%, transparent 50%),
    radial-gradient(ellipse 70% 30% at 50% 100%, rgba(0,20,60,0.80) 0%, transparent 60%),
    linear-gradient(160deg,#040c18 0%,#061422 35%,#081c30 65%,#0a2038 100%);
}
body::after{
  content:"";position:fixed;z-index:-1;pointer-events:none;
  top:-200px;right:-150px;
  width:700px;height:700px;
  border-radius:50%;
  border:1px solid rgba(0,133,202,0.10);
  box-shadow:
    inset 0 0 120px rgba(0,133,202,0.08),
    0 0 80px rgba(0,133,202,0.04);
}
body::before,body::after{animation:none;}

/* Second arc — smaller, lower */
#app::before{
  content:"";position:fixed;z-index:-1;pointer-events:none;
  bottom:-100px;right:0px;
  width:400px;height:400px;
  border-radius:50%;
  border:1px solid rgba(0,133,202,0.07);
  box-shadow:inset 0 0 60px rgba(0,133,202,0.05);
}

/* Diagonal light beam — top right */
#app::after{
  content:"";position:fixed;z-index:-1;pointer-events:none;
  top:0;right:0;
  width:50%;height:100%;
  background:
    linear-gradient(135deg,
      transparent 0%,
      transparent 55%,
      rgba(0,100,180,0.04) 55%,
      rgba(0,100,180,0.04) 56%,
      transparent 56%,
      transparent 70%,
      rgba(0,80,160,0.03) 70%,
      rgba(0,80,160,0.03) 71%,
      transparent 71%
    );
}

/* Progress */
#prog-wrap{height:3px;background:rgba(255,255,255,0.08);overflow:hidden;display:none;}
#prog-bar{height:100%;background:var(--blue);transition:width 0.4s ease;}
#prog-label{font-size:11px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--blue-lt);text-align:left;display:none;padding:14px 0 20px;}

/* Step anim */
.step{animation:fu 0.28s ease both;}
@keyframes fu{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Hero */
.hero{padding:56px 0 40px;text-align:left;}


.eyebrow-label{display:block;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--blue-lt);margin-bottom:10px;}
.eyebrow-line{display:block;width:40px;height:2px;background:var(--blue);margin-bottom:24px;border-radius:2px;}
.hero h1{font-size:clamp(32px,7vw,52px);font-weight:700;line-height:1.10;letter-spacing:-0.6px;color:var(--t1);margin-bottom:20px;max-width:520px;}
.hero h1 .acc{color:var(--blue-lt);}
.hero-sub{font-size:15px;color:var(--t2);line-height:1.70;max-width:420px;margin-bottom:36px;}
.btn-start{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--blue);color:#fff;border:none;border-radius:8px;
  padding:15px 28px;font-size:16px;font-weight:600;font-family:var(--font);
  cursor:pointer;box-shadow:0 6px 24px rgba(0,133,202,0.32);
  transition:transform 0.2s,background 0.18s,box-shadow 0.2s;
}
.btn-start .arr{transition:transform 0.2s;}
.btn-start:hover{background:var(--blue-h);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,133,202,0.42);}
.btn-start:hover .arr{transform:translateX(4px);}
.btn-start:active{transform:translateY(0);}
.hero-proof{margin-top:16px;font-size:11px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:8px;}
.hero-proof .dot{width:4px;height:4px;border-radius:50%;background:var(--blue);opacity:0.7;flex-shrink:0;}

/* Advisor card */
.advisor-card{display:flex;align-items:center;gap:0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:16px;overflow:visible;margin:8px 0 0;padding:8px 0 8px 0;}
.advisor-photo{width:110px;height:110px;flex-shrink:0;object-fit:cover;object-position:center 15%;display:block;border-radius:50%;margin:8px 12px;}
.advisor-sep{width:1px;height:80px;background:rgba(255,255,255,0.09);flex-shrink:0;}
.advisor-info{padding:8px 20px;flex:1;}
.advisor-name{font-size:17px;font-weight:700;color:var(--t1);margin-bottom:3px;}
.advisor-title{font-size:10px;font-weight:600;letter-spacing:0.11em;text-transform:uppercase;color:var(--blue-lt);margin-bottom:12px;}
.advisor-links{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.advisor-links a{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);text-decoration:none;transition:color 0.15s;}
.advisor-links a:hover{color:#fff;}
.advisor-co{font-size:10px;color:rgba(185,210,230,0.52);letter-spacing:0.01em;}

/* Services */
.services{display:flex;align-items:flex-start;justify-content:space-between;margin:36px 0 0;padding:28px 0 24px;border-top:1px solid rgba(255,255,255,0.07);position:relative;}
.services::after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,133,202,0.35) 30%,rgba(0,133,202,0.60) 50%,rgba(0,133,202,0.35) 70%,transparent);}
.svc{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;padding:0 8px;position:relative;text-align:center;}
.svc+.svc::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:rgba(255,255,255,0.08);}
.svc-icon{width:36px;height:36px;color:var(--blue-lt);flex-shrink:0;}
.svc-label{font-size:12px;font-weight:600;color:var(--t1);line-height:1.2;}

/* Reviews */
.reviews-wrap{margin-top:44px;}
.reviews{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;}
.rc{border-radius:12px;padding:20px;text-align:left;transition:all 0.4s;}
.rc.primary{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);transform:scale(1.02);box-shadow:0 6px 24px rgba(0,0,0,0.20);}
.rc.secondary{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);opacity:0.82;}
.stars{color:#fbbf24;font-size:12px;margin-bottom:8px;}
.rv-text{font-size:13px;font-style:italic;max-width:95%;line-height:1.60;color:var(--t2);}
.rv-name{font-size:11px;color:var(--t3);margin-top:10px;}

/* Footer */
.site-footer{margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.07);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.site-footer img{height:26px;object-fit:contain;opacity:0.80;}
.site-footer p{font-size:10px;color:rgba(160,190,215,0.45);line-height:1.6;max-width:92%;}
.site-footer .fl{display:flex;gap:16px;}
.site-footer .fl a{font-size:11px;color:rgba(160,190,215,0.45);text-decoration:underline;}

/* Question */
.q-counter{font-size:11px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--blue-lt);margin-bottom:12px;padding-top:44px;}
.q-title{font-size:clamp(20px,5vw,28px);font-weight:700;line-height:1.25;margin-bottom:8px;color:var(--t1);}
.q-instruction{font-size:13px;color:rgba(160,190,215,0.55);margin-bottom:24px;font-weight:400;}

/* ── SIMPLE OPTIONS (Q2, Q3) ── */
.options{display:flex;flex-direction:column;gap:10px;}
.ob{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:12px;
  padding:17px 20px;
  font-size:15px;font-weight:500;
  font-family:var(--font);color:var(--t1);
  cursor:pointer;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:background 0.20s,border-color 0.20s,transform 0.18s,box-shadow 0.20s;
  position:relative;overflow:hidden;
}
.ob::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,133,202,0.08) 0%,transparent 60%);
  opacity:0;transition:opacity 0.20s;
}
.ob:hover{
  background:rgba(0,133,202,0.10);
  border-color:rgba(0,133,202,0.35);
  transform:translateX(3px);
  box-shadow:0 4px 20px rgba(0,0,0,0.20);
}
.ob:hover::before{opacity:1;}
.ob.selected{
  background:rgba(0,133,202,0.18);
  border-color:rgba(0,133,202,0.60);
  box-shadow:0 0 0 1px rgba(0,133,202,0.30),0 4px 20px rgba(0,0,0,0.20);
  transform:translateX(3px);
}
.ob .ob-text{flex:1;}
.ob .ob-icon{
  flex-shrink:0;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.20s,opacity 0.20s;
}
.ob .ob-chevron{color:rgba(160,190,215,0.35);transition:color 0.20s,transform 0.20s;}
.ob:hover .ob-chevron{color:rgba(0,133,202,0.80);transform:translateX(2px);}
.ob .ob-check{
  color:var(--blue-lt);opacity:0;transform:scale(0.6);
  transition:opacity 0.20s,transform 0.22s;position:absolute;
}
.ob.selected .ob-chevron{opacity:0;}
.ob.selected .ob-check{opacity:1;transform:scale(1);}

/* ── RICH OPTIONS (Q1) ── */
.opts-rich{display:flex;flex-direction:column;gap:10px;}
.or{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:12px;
  padding:17px 20px;
  text-align:left;cursor:pointer;font-family:var(--font);
  display:flex;align-items:center;gap:14px;
  transition:background 0.20s,border-color 0.20s,transform 0.18s,box-shadow 0.20s;
  position:relative;overflow:hidden;
}
.or::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,133,202,0.08) 0%,transparent 60%);
  opacity:0;transition:opacity 0.20s;
}
.or:hover{
  background:rgba(0,133,202,0.10);
  border-color:rgba(0,133,202,0.35);
  transform:translateX(3px);
  box-shadow:0 4px 20px rgba(0,0,0,0.20);
}
.or:hover::before{opacity:1;}
.or.selected{
  background:rgba(0,133,202,0.18);
  border-color:rgba(0,133,202,0.60);
  box-shadow:0 0 0 1px rgba(0,133,202,0.30),0 4px 20px rgba(0,0,0,0.20);
  transform:translateX(3px);
}
.or-text{flex:1;}
.ol{font-size:15px;font-weight:600;color:var(--t1);display:block;margin-bottom:3px;}
.os{font-size:13px;color:rgba(160,190,215,0.60);display:block;line-height:1.45;}
.or-icon{
  flex-shrink:0;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.or-chevron{color:rgba(160,190,215,0.35);transition:color 0.20s,transform 0.20s;}
.or:hover .or-chevron{color:rgba(0,133,202,0.80);transform:translateX(2px);}
.or-check{
  color:var(--blue-lt);opacity:0;transform:scale(0.6);
  transition:opacity 0.20s,transform 0.22s;position:absolute;
}
.or.selected .or-chevron{opacity:0;}
.or.selected .or-check{opacity:1;transform:scale(1);}

/* ── 2-COL (Q3 Yes/No) ── */
.opts-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fu-box{margin-top:18px;text-align:left;}
.fu-lbl{font-size:13px;color:rgba(200,218,235,0.65);display:block;margin-bottom:6px;line-height:1.5;}
.fu-opt{color:rgba(160,190,215,0.40);font-weight:400;}
.fu-ta{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;font-family:var(--font);resize:none;outline:none;line-height:1.5;min-height:88px;transition:border-color 0.16s;}
.fu-ta::placeholder{color:rgba(160,190,215,0.35);}
.fu-ta:focus{border-color:rgba(0,133,202,0.50);}
.fu-actions{display:flex;gap:12px;align-items:center;margin-top:14px;}
.btn-cont{flex:1;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:15px 0;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background 0.18s;}
.btn-cont:hover{background:var(--blue-h);}
.btn-skip{font-size:13px;color:rgba(160,190,215,0.42);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:var(--font);}

/* Form */
.fh{text-align:left;margin-bottom:28px;padding-top:44px;}
.fh h2{font-size:clamp(24px,5vw,32px);font-weight:700;margin-bottom:8px;color:var(--t1);}
.fh p{font-size:14px;color:var(--t2);line-height:1.55;}
.ffields{display:flex;flex-direction:column;gap:12px;width:100%;margin:0 0 20px;}
.inp{width:100%;height:50px;padding:0 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:#fff;font-size:15px;font-family:var(--font);outline:none;transition:border-color 0.18s,background 0.18s;}
.inp::placeholder{color:rgba(160,190,215,0.40);}
.inp:focus{border-color:rgba(0,133,202,0.55);background:rgba(0,133,202,0.08);}
.btn-sub{display:block;width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:16px 28px;font-size:16px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background 0.18s,transform 0.15s;box-shadow:0 4px 18px rgba(0,133,202,0.28);}
.btn-sub:hover{background:var(--blue-h);transform:translateY(-1px);}
.btn-sub:disabled{opacity:0.60;cursor:not-allowed;transform:none;}
.cw{width:100%;margin:16px 0 0;border-top:1px solid rgba(255,255,255,0.07);padding-top:12px;}
.cl{display:flex;align-items:flex-start;gap:8px;cursor:pointer;}
.cl input{margin-top:3px;flex-shrink:0;accent-color:var(--blue);}
.ct-text{font-size:10px;line-height:1.6;color:rgba(160,190,215,0.50);}
.err{font-size:12px;color:var(--red);margin-top:8px;}

/* Thanks */
/* ── THANKS PAGE ── */
.tw{padding:52px 0 16px;}
.tw-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--blue-lt);margin-bottom:16px;display:block;}
.tw h2{font-size:clamp(28px,6vw,44px);font-weight:700;color:var(--t1);margin-bottom:14px;line-height:1.12;letter-spacing:-0.4px;}
.tw-sub{font-size:15px;color:var(--t2);line-height:1.70;max-width:480px;margin-bottom:36px;font-weight:400;}

/* Primary CTA */
.tw-primary{margin-bottom:10px;}
.book-btn{
  display:inline-flex;align-items:center;gap:12px;
  background:var(--blue);color:#fff;border-radius:8px;
  padding:17px 32px;font-size:17px;font-weight:600;
  font-family:var(--font);text-decoration:none;
  box-shadow:0 6px 28px rgba(0,133,202,0.35);
  transition:background 0.18s,transform 0.20s,box-shadow 0.20s;
}
.book-btn:hover{background:var(--blue-h);transform:translateY(-2px);box-shadow:0 10px 34px rgba(0,133,202,0.45);}
.tw-cta-note{font-size:12px;color:rgba(180,208,228,0.72);margin-top:10px;margin-bottom:28px;}

/* What happens next — timeline */
.tw-next{margin-bottom:44px;margin-top:0;}
.tw-next-label{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(180,208,228,0.68);margin-bottom:24px;display:block;}
.tw-steps{display:flex;flex-direction:column;gap:0;}
.tw-step{display:flex;gap:20px;position:relative;}
.tw-step+.tw-step{margin-top:0;}
/* Vertical line connecting steps */
.tw-step-num-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.tw-step-num{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,133,202,0.12);border:1px solid rgba(0,133,202,0.25);
  color:var(--blue-lt);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:var(--font);
}
.tw-step-line{width:1px;flex:1;background:rgba(255,255,255,0.07);min-height:28px;}
.tw-step:last-child .tw-step-line{display:none;}
.tw-step-body{padding:4px 0 28px;}
.tw-step-title{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:3px;}
.tw-step-desc{font-size:13px;color:rgba(185,210,230,0.78);line-height:1.55;}

/* Advisor strip */
.tw-advisor{
  display:flex;align-items:center;gap:16px;
  padding:20px 0;
  border-top:1px solid rgba(255,255,255,0.07);
  margin-bottom:36px;
}
.tw-advisor-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center 15%;flex-shrink:0;}
.tw-advisor-name{font-size:15px;font-weight:600;color:var(--t1);margin-bottom:2px;}
.tw-advisor-title{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:var(--blue-lt);margin-bottom:6px;}
.tw-advisor-contact{display:flex;gap:16px;flex-wrap:wrap;}
.tw-advisor-contact a{font-size:12px;color:rgba(185,210,230,0.72);text-decoration:none;transition:color 0.15s;}
.tw-advisor-contact a:hover{color:#fff;}

/* Mobile */
@media(max-width:480px){
  .tw{padding:40px 0 12px;}
  .book-btn{display:flex;width:100%;justify-content:center;font-size:16px;padding:17px 24px;}
  .tw-advisor{flex-direction:row;}
}

/* Sticky */
#sticky{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(5,14,26,0.97);padding:12px 20px;z-index:999;border-top:1px solid rgba(255,255,255,0.08);}
#sticky button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:13px 0;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;}
@media(min-width:640px){#sticky{display:none!important;}}

/* Mobile */
@media(max-width:480px){
  .hero{padding:40px 0 32px;}
  .advisor-card{flex-direction:column;align-items:center;padding:20px;}
  .advisor-photo{width:90px;height:90px;margin:0 0 12px;}
  .advisor-sep{display:none;}
  .advisor-info{padding:0;text-align:center;}
  .advisor-links a{justify-content:center;}
  .services{flex-wrap:wrap;}
  .svc{flex:0 0 50%;max-width:50%;padding:14px 8px;}
  .svc+.svc::before{display:none;}
  .svc:nth-child(odd){border-right:1px solid rgba(255,255,255,0.08);}
  .svc:nth-child(3){border-top:1px solid rgba(255,255,255,0.08);}
}

/* Render */
function render(){
  var pw=document.getElementById("prog-wrap"),
      pb=document.getElementById("prog-bar"),
      pl=document.getElementById("prog-label"),
      view=document.getElementById("view"),
      sticky=document.getElementById("sticky");
  if(step>=1&&step<=3){
    pw.style.display="block";
    pb.style.width=Math.round((step/3)*100)+"%";
    pl.style.display="none";
    if(sticky)sticky.style.display="none";
  }else{pw.style.display="none";pl.style.display="none";}
  if(step===0){view.innerHTML=home();startReviews();if(sticky)sticky.style.display="none";}
  else if(step>=1&&step<=3){view.innerHTML=question(step-1);stopReviews();}
  else if(step===4){
    view.innerHTML=form();stopReviews();
    ["firstname","lastname","email","phone"].forEach(function(k){
      var el=document.getElementById("f-"+k);if(el)el.value=formData[k]||"";
    });
    var cb=document.getElementById("f-consent");if(cb)cb.checked=consented;
  }else if(step===5){view.innerHTML=thanks();stopReviews();}
}

        "</div>" +

    }).join("");
    return "<div class=\"step\"><p class=\"q-counter\">Question "+(qi+1)+" of 3</p><h2 class=\"q-title\">"+esc(q.title)+"</h2><p class=\"q-instruction\">Select the option that best reflects your situation.</p><div class=\"opts-rich\">"+opts+"</div></div>";
  }

  if(q.type==="advisor"){
    var aOpts=q.options.map(function(o,oi){
      return "<button class=\"ob\" id=\"opt-"+qi+"-"+oi+"\" onclick=\"selectAdvisor("+qi+","+oi+",'"+o+"',"+next+")\">" +
        "<span class=\"ob-text\">"+esc(o)+"</span>" +
        "<div class=\"ob-icon\">" +
          "<svg class=\"ob-chevron\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6,3 11,8 6,13\"/></svg>" +
          "<svg class=\"ob-check\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3,8 6.5,11.5 13,5\"/></svg>" +
        "</div>" +
      "</button>";
    }).join("");
    return "<div class=\"step\">" +
      "<p class=\"q-counter\">Question "+(qi+1)+" of 3</p>" +
      "<h2 class=\"q-title\">"+esc(q.title)+"</h2>" +
      "<p class=\"q-instruction\">Select the option that best reflects your situation.</p>" +
      "<div class=\"opts-2col\">"+aOpts+"</div>" +
      "<div class=\"fu-box\" id=\"fu\" style=\"display:none;\">" +
        "<label class=\"fu-lbl\">What has you considering a change or second opinion? <span class=\"fu-opt\">(optional)</span></label>" +
        "<textarea class=\"fu-ta\" id=\"fu-ta\" placeholder=\"e.g. lack of communication, fees, investment performance, or simply wanting another perspective\"></textarea>" +
        "<div class=\"fu-actions\">" +
          "<button class=\"btn-cont\" onclick=\"contAdvisor("+next+")\">Continue &#8594;</button>" +
          "<button class=\"btn-skip\" onclick=\"contAdvisor("+next+")\">Skip</button>" +
        "</div>" +
      "</div>" +
    "</div>";
  }

  var sOpts=q.options.map(function(o,oi){
    return "<button class=\"ob\" id=\"opt-"+qi+"-"+oi+"\" onclick=\"selectSimple("+qi+","+oi+","+next+")\">" +
      "<span class=\"ob-text\">"+esc(o)+"</span>" +
      "<div class=\"ob-icon\">" +
        "<svg class=\"ob-chevron\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6,3 11,8 6,13\"/></svg>" +
        "<svg class=\"ob-check\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3,8 6.5,11.5 13,5\"/></svg>" +
      "</div>" +
    "</button>";
  }).join("");
  return "<div class=\"step\"><p class=\"q-counter\">Question "+(qi+1)+" of 3</p><h2 class=\"q-title\">"+esc(q.title)+"</h2><p class=\"q-instruction\">Select the option that best reflects your situation.</p><div class=\"options\">"+sOpts+"</div></div>";
}

/* Form */
function form(){
  return "<div class=\"step\">" +
    "<div class=\"fh\"><h2>Almost done.</h2><p>Where should I send your information and follow up?</p></div>" +
    "<div class=\"ffields\">" +
      "<input class=\"inp\" id=\"f-firstname\" type=\"text\"  placeholder=\"First name\"  autocomplete=\"given-name\"  oninput=\"formData.firstname=this.value\" />" +
      "<input class=\"inp\" id=\"f-lastname\"  type=\"text\"  placeholder=\"Last name\"   autocomplete=\"family-name\" oninput=\"formData.lastname=this.value\" />" +
      "<input class=\"inp\" id=\"f-email\"     type=\"email\" placeholder=\"Email\"       autocomplete=\"email\"       oninput=\"formData.email=this.value\" />" +
      "<input class=\"inp\" id=\"f-phone\"     type=\"tel\"   placeholder=\"Phone\"       autocomplete=\"tel\"         oninput=\"formData.phone=this.value\" />" +
    "</div>" +
    "<button class=\"btn-sub\" id=\"f-sub\" onclick=\"submitForm()\">Continue &#8594;</button>" +
    consentBox() +
    "<p class=\"err\" id=\"f-err\"></p>" +
  "</div>";
}

/* Thanks */
function thanks(){
  var first=(formData.firstname||"").trim().split(" ")[0];
  var greeting=first?"Thanks, "+esc(first)+".":"You're all set.";
  return "<div class=\"step\">" +
    "<div class=\"tw\">" +

      "<span class=\"tw-eyebrow\">Thank you</span>" +
      "<h2>"+greeting+"</h2>" +
      "<p class=\"tw-sub\">I've received your information and will be in touch shortly. If you'd like to get things moving sooner, you can book a time directly below.</p>" +

      "<div class=\"tw-primary\">" +
        "<a href=\""+BOOKING_URL+"\" target=\"_blank\" rel=\"noopener\" class=\"book-btn\" " +
          "onclick=\"if(typeof fbq!=='undefined')fbq('track','Schedule',{content_name:'Strategy Call Booked'});if(typeof gtag!=='undefined')gtag('event','booking_clicked',{event_category:'Conversion'});\">" +
          "Book a 15-Minute Call &#8594;" +
        "</a>" +
      "</div>" +
      "<p class=\"tw-cta-note\">A quick 15-minute conversation at a time that works for you.</p>" +

      "<div class=\"tw-next\">" +
        "<span class=\"tw-next-label\">What happens next</span>" +
        "<div class=\"tw-steps\">" +

          "<div class=\"tw-step\">" +
            "<div class=\"tw-step-num-wrap\">" +
              "<div class=\"tw-step-num\">01</div>" +
              "<div class=\"tw-step-line\"></div>" +
            "</div>" +
            "<div class=\"tw-step-body\">" +
              "<p class=\"tw-step-title\">I review your answers</p>" +
              "<p class=\"tw-step-desc\">I'll review what you've shared before we speak so our conversation can focus on what matters most to you.</p>" +
            "</div>" +
          "</div>" +

          "<div class=\"tw-step\">" +
            "<div class=\"tw-step-num-wrap\">" +
              "<div class=\"tw-step-num\">02</div>" +
              "<div class=\"tw-step-line\"></div>" +
            "</div>" +
            "<div class=\"tw-step-body\">" +
              "<p class=\"tw-step-title\">We have a quick conversation</p>" +
              "<p class=\"tw-step-desc\">We'll talk through your priorities, where you are today, and any questions or concerns you have.</p>" +
            "</div>" +
          "</div>" +

          "<div class=\"tw-step\">" +
            "<div class=\"tw-step-num-wrap\">" +
              "<div class=\"tw-step-num\">03</div>" +
              "<div class=\"tw-step-line\"></div>" +
            "</div>" +
            "<div class=\"tw-step-body\">" +
              "<p class=\"tw-step-title\">We identify the next steps</p>" +
              "<p class=\"tw-step-desc\">I'll help you identify where there may be opportunities to improve your financial plan and what the appropriate next steps could look like.</p>" +
            "</div>" +
          "</div>" +

        "</div>" +
      "</div>" +

      "<span class=\"tw-next-label\" style=\"display:block;margin-bottom:20px;color:rgba(180,208,228,0.68);\">Your advisor</span>" +
      advisorCard() +

      footer() +
    "</div>" +
  "</div>";
}

/* Actions */
function goStep(n){
  if(typeof fbq!=="undefined"){
    if(n===1)fbq("track","InitiateCheckout",{content_name:"Assessment Started"});
    if(n===4)fbq("track","AddToCart",{content_name:"Questions Complete"});
    if(n===5)fbq("track","Schedule",{content_name:"Thanks Page Viewed"});
  }
  if(typeof gtag!=="undefined"){
    if(n===1)gtag("event","assessment_started",{event_category:"Funnel"});
    if(n===2)gtag("event","q1_answered",{event_category:"Funnel"});
    if(n===3)gtag("event","q2_answered",{event_category:"Funnel"});
    if(n===4)gtag("event","q3_answered",{event_category:"Funnel"});
    if(n===5)gtag("event","thanks_viewed",{event_category:"Funnel"});
  }
  step=n;
  window.scrollTo({top:0,behavior:"smooth"});
  render();
}

function flash(qi,oi,cls){
  var b=document.getElementById("opt-"+qi+"-"+oi);
  if(b)b.classList.add(cls);
}
function selectRich(qi,oi,next){flash(qi,oi,"selected");answers.whatMattersMost=QUESTIONS[qi].options[oi].label;setTimeout(function(){goStep(next);},150);}
function selectSimple(qi,oi,next){flash(qi,oi,"selected");var q=QUESTIONS[qi];answers[q.key]=q.options[oi];setTimeout(function(){goStep(next);},150);}
function selectAdvisor(qi,oi,val,next){
  flash(qi,oi,"selected");answers.hasAdvisor=val;
  if(val==="Yes"){var b=document.getElementById("fu");if(b)b.style.display="block";}
  else{answers.advisorChangeReason="";setTimeout(function(){goStep(next);},150);}
}
function contAdvisor(next){
  var ta=document.getElementById("fu-ta");
  answers.advisorChangeReason=ta?ta.value.trim():"";
  goStep(next);
}

function submitForm(){
  var err=document.getElementById("f-err");
  formData.firstname=(document.getElementById("f-firstname")||{}).value||"";
  formData.lastname =(document.getElementById("f-lastname") ||{}).value||"";
  formData.email    =(document.getElementById("f-email")    ||{}).value||"";
  formData.phone    =(document.getElementById("f-phone")    ||{}).value||"";
  var cb=document.getElementById("f-consent");consented=cb?cb.checked:false;

  if(!formData.firstname.trim()){err.textContent="Please enter your first name.";return;}
  if(!formData.lastname.trim()) {err.textContent="Please enter your last name.";return;}
  if(!formData.email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(formData.email)){err.textContent="Please enter a valid email address.";return;}
  if(!formData.phone.trim())    {err.textContent="Please enter your phone number.";return;}
  if(!consented)                {err.textContent="Please provide consent to continue.";return;}

  err.textContent="";
  var btn=document.getElementById("f-sub");
  if(btn){btn.textContent="Submitting...";btn.disabled=true;}

  if(typeof fbq!=="undefined")fbq("track","Lead",{content_name:"Contact Form Submitted"});
  if(typeof gtag!=="undefined")gtag("event","generate_lead",{event_category:"Funnel"});

  var summary="What Matters Most: "+(answers.whatMattersMost||"Not answered")+" | Invested So Far: "+(answers.investedSoFar||"Not answered")+" | Has Advisor: "+(answers.hasAdvisor||"Not answered")+" | Reason: "+(answers.advisorChangeReason||"N/A");

  fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({
      "form-name":"lead",
      "First Name":formData.firstname,
      "Last Name":formData.lastname,
      "Email":formData.email,
      "Phone":formData.phone,
      "What Matters Most":answers.whatMattersMost||"",
      "Invested So Far":answers.investedSoFar||"",
      "Has Advisor":answers.hasAdvisor||"",
      "Reason for Change":answers.advisorChangeReason||"",
      "Summary":summary
    }).toString()
  }).then(function(){goStep(5);}).catch(function(){goStep(5);});
}

/* Reviews rotation */
function startReviews(){
  stopReviews();
  reviewTimer=setInterval(function(){
    reviewIdx=(reviewIdx+2)%REVIEWS.length;
    var c=document.getElementById("reviews-container");if(!c)return;
    var r0=REVIEWS[reviewIdx%REVIEWS.length];
    var r1=REVIEWS[(reviewIdx+1)%REVIEWS.length];
    c.style.opacity="0";c.style.transition="opacity 0.3s";
    setTimeout(function(){
      c.innerHTML=
        "<div class=\"rc primary\"><div class=\"stars\">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p class=\"rv-text\">"+esc(r0.text)+"</p><p class=\"rv-name\">"+esc(r0.name)+"</p></div>"+
        "<div class=\"rc secondary\"><div class=\"stars\">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p class=\"rv-text\">"+esc(r1.text)+"</p><p class=\"rv-name\">"+esc(r1.name)+"</p></div>";
      c.style.opacity="1";
    },300);
  },5000);
}
function stopReviews(){clearInterval(reviewTimer);}

/* Sticky */
window.addEventListener("scroll",function(){
  var s=document.getElementById("sticky");if(!s)return;
  s.style.display=(window.scrollY>300&&step===0)?"block":"none";
});

/* Drop-off tracking */
function trackDropOff(){
  if(dropOffFired)return;
  if(step>=1&&step<=3){
    dropOffFired=true;
    var qt=QUESTIONS[step-1]?QUESTIONS[step-1].title:"Unknown";
    if(typeof gtag!=="undefined")gtag("event","assessment_abandoned",{event_category:"Funnel",event_label:"Q"+step+": "+qt});
    if(typeof fbq!=="undefined")fbq("trackCustom","AssessmentAbandoned",{question_number:step});
  }else if(step===4){
    dropOffFired=true;
    if(typeof gtag!=="undefined")gtag("event","form_abandoned",{event_category:"Funnel"});
  }
}
document.addEventListener("visibilitychange",function(){if(document.hidden)trackDropOff();});
window.addEventListener("pagehide",trackDropOff);

/* Boot */
render();
</script>
</body>
</html>
